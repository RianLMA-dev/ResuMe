version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python:
        update-types: [minor, patch]
    ignore:
      # Limitados por pacotes que dependem deles; o pip não resolve se subirem sozinhos.
      - dependency-name: tenacity        # google-genai exige tenacity < 9.2
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: uuid-utils      # langsmith exige uuid-utils < 1.0
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      node:
        update-types: [minor, patch]
