name: Segurança

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Toda segunda, 08:23 em Brasília. Novas falhas são publicadas sem que o código mude.
    - cron: "23 11 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Dependências do back-end (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --no-deps --disable-pip

  node:
    name: Dependências do front-end (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm audit --audit-level=moderate
